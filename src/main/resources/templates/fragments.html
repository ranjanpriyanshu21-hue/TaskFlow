<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title th:text="${title} + ' - TaskFlow'">TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar" th:fragment="topbar">
  <a class="brand" th:href="@{/projects}">TaskFlow</a>
  <span class="live" id="liveStatus" title="Real-time connection"><i></i><span>Connecting</span></span>
  <span class="spacer"></span>
  <div class="bell-wrap">
    <button class="icon-btn" id="bellBtn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>
      <span class="badge" id="bellCount" hidden>0</span>
    </button>
    <div class="dropdown" id="bellMenu" hidden>
      <div class="dropdown-head">Notifications</div>
      <ul id="bellList"></ul>
    </div>
  </div>
  <span class="me" th:text="${me}">user</span>
  <form th:action="@{/logout}" method="post"><button class="link-btn" type="submit">Sign out</button></form>
</header>
<div th:fragment="scripts">
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</div>
</body>
</html>
